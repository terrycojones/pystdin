[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pystdin"
version = "1.0.5"
description = "Wrap command-line Python code in a loop over standard input."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Terry Jones", email = "tcj25@cam.ac.uk" },
]
keywords = ["python", "stdin", "standard input"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/terrycojones/pystdin"
Repository = "https://github.com/terrycojones/pystdin"

[project.scripts]
pystdin = "pystdin:main"

[dependency-groups]
dev = [
    "flake8",
    "pytest",
]

[tool.hatch.build.targets.wheel]
include = ["pystdin.py"]
